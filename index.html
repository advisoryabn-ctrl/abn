<style>
:root{--navy:#0B2545;--blue:#13406F;--blue2:#1F5E9E;--gold:#C9A24A;--gold2:#E8D29B;--bg:#F3F5F9;--ink:#14213D;--mute:#6B7891;--line:#E3E8F0;--red:#B42318;--green:#147D45;--amber:#B45309;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'IBM Plex Sans Arabic',-apple-system,system-ui,sans-serif;color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(90px + var(--sb))}
.hidden{display:none!important}
/* login */
#login{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;justify-content:center;padding:26px;padding-top:calc(26px + var(--st));overflow:hidden;z-index:60}
#login .bigN{position:absolute;top:40px;left:-40px;font:800 360px/1 Georgia,serif;color:rgba(201,162,74,.07);pointer-events:none}
.lbox{max-width:420px;width:100%;margin:0 auto;position:relative}
.llogo{width:66px;height:66px;border-radius:18px;background:linear-gradient(135deg,#D9B562,#A8822F);display:grid;place-items:center;margin:0 auto;font:800 34px Georgia,serif;color:var(--navy)}
.lbrand{color:#fff;font-size:30px;font-weight:700;text-align:center;margin-top:14px;direction:ltr}
.lsub{color:var(--gold2);font-size:13px;text-align:center;margin:2px 0 28px;direction:ltr}
.lcard{background:var(--bg);border-radius:20px;padding:18px}
.lfoot{color:#8FA3C0;text-align:center;margin-top:26px;font-size:13px}
/* header */
.top{background:var(--navy);color:#fff;padding:calc(14px + var(--st)) 18px 58px;position:relative;overflow:hidden}
.top .bgN{position:absolute;left:-14px;top:-48px;font:700 210px/1 Georgia,serif;color:rgba(201,162,74,.08);pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;position:relative}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#D9B562,#A8822F);display:grid;place-items:center;font:700 21px Georgia,serif;color:var(--navy)}
.brand b{font-size:17px;display:block;direction:ltr;text-align:right}
.brand small{display:block;font-size:10.5px;color:var(--gold2);direction:ltr}
.avatar.setb{width:auto;border-radius:999px;padding:0 13px;font-size:12.5px;font-weight:600;white-space:nowrap}
.avatar{margin-inline-start:auto;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:700;border:1px solid rgba(201,162,74,.6);color:#fff}
.hello{margin-top:18px;position:relative}
.hello p{font-size:12.5px;color:#B8C7DD}
.hello h1{font-size:21px;font-weight:700;margin-top:2px}
main{padding:0 14px;margin-top:-40px;position:relative}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(11,37,69,.05),0 6px 18px rgba(11,37,69,.06);margin-bottom:12px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 10px}
.sec h2{font-size:15.5px;font-weight:700}
.sec button{font-size:13px;color:var(--blue2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.big{font-size:30px;font-weight:800;color:var(--navy)}
.nums{display:flex;gap:8px;margin-top:6px}
.num{flex:1;background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center}
.num b{display:block;font-size:20px;font-weight:800}
.num span{font-size:11.5px;color:var(--mute)}
.bar{height:7px;background:#EDF0F5;border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;border-radius:9px;background:var(--blue2);transition:width .3s}
.bar.done i{background:var(--green)}.bar.late i{background:var(--red)}.bar.gold i{background:var(--gold)}
.goldEdge{border-inline-start:4px solid var(--gold)}
.k{font-size:11.5px;color:var(--amber);font-weight:700}
.wcard{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(11,37,69,.05),0 4px 12px rgba(11,37,69,.05);cursor:pointer}
.wcard:active{transform:scale(.985)}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.type{background:#EAF1FA;color:var(--blue)}
.st-new{background:#EEF0F4;color:#55617A}.st-prog{background:#E7F0FB;color:var(--blue2)}.st-late{background:#FDECEA;color:var(--red)}.st-done{background:#E6F4EC;color:var(--green)}
.wcard h3{font-size:15.5px;font-weight:700;margin:9px 0 2px;line-height:1.5}
.meta{font-size:12.5px;color:var(--mute)}
.meta b{color:var(--ink)}
.hear{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hear:last-child{border:0}
.cal{flex:none;width:48px;text-align:center;border-radius:10px;background:var(--navy);color:#fff;padding:5px 0;line-height:1.2}
.cal b{display:block;font-size:17px}.cal small{font-size:10.5px;color:var(--gold2)}
.empty{text-align:center;color:var(--mute);padding:20px 8px;line-height:1.8}
.seg{display:flex;background:#fff;border-radius:12px;padding:4px;margin-bottom:10px;box-shadow:0 1px 2px rgba(11,37,69,.06)}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--navy);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:12.5px;color:#3d4a63}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.input,.f input,.f select,.f textarea{display:block;width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:#fff;outline:none;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
.input:focus,.f input:focus,.f textarea:focus{border-color:var(--blue2)}
.f textarea{min-height:120px;resize:vertical;line-height:1.7}
.lbl{display:block;font-size:12.5px;color:var(--mute);margin:0 0 6px;font-weight:600}
.f .fld{margin-bottom:12px}
.primary{width:100%;padding:14px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:15px}
.primary:disabled{opacity:.6}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + var(--sb));z-index:20}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;line-height:1.25;font-size:11.5px;color:#8A95AA;position:relative}
.tabs button.on{color:var(--navy);font-weight:700}
.tabs svg{width:23px;height:23px;stroke:#8A95AA;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on svg{stroke:var(--gold)}
.badge{position:absolute;top:-4px;left:calc(50% - 22px);background:var(--red);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.fab{position:fixed;bottom:calc(92px + var(--sb));left:max(18px,calc(50% - 242px));width:58px;height:58px;border-radius:18px;background:var(--gold);display:grid;place-items:center;box-shadow:0 8px 20px rgba(201,162,74,.45);z-index:21}
.fab svg{width:28px;height:28px;stroke:var(--navy);stroke-width:2.4;fill:none;stroke-linecap:round}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(11,37,69,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:10px 16px calc(28px + var(--sb));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:5px;background:#CBD3DF;margin:2px auto 12px}

  const f=w.flow,s=f.stage,d=f.dates||{};let dl=null;
  const ro=a=>a&&f.reopened&&f.reopened>a?f.reopened:a;
  if(s==='accept')dl=d.offer?addWork(ro(d.offer),5):null;
  else if(s==='pay')dl=d.accepted?addWork(ro(d.accepted),10):null;
  else if(s==='expert')dl=d.paid?addWork(d.paid,10):null;
  else if(s==='report')dl=d.expert?addDays(d.expert,30):(w.due||null);
  else if(s==='objection')dl=d.report?addWork(d.report,5):null;
  else if(s==='revise'){const b=[d.objected,d.returned].filter(Boolean).sort().pop();dl=b?addWork(b,10):null}
  let stage=s,auto=false;
  const over=!!(dl&&todayISO()>dl);
  if(over&&(s==='accept'||s==='pay')){stage='rejected';auto=true}
  return{stage,base:s,auto,dl,wait:over&&s==='objection'};
}
const pctOf=w=>{if(isFlow(w))return PCT[eff(w).stage]??0;const s=w.steps||[];return s.length?Math.round(s.filter(x=>x.done).length*100/s.length):0};
function statusOf(w){
  if(w.cancelled_at)return'can';
  if(isFlow(w)){const e=eff(w);if(e.stage==='done')return'done';if(e.stage==='rejected')return'rej';if(e.dl&&todayISO()>e.dl&&!e.wait)return'late';return e.base==='offer'?'new':'prog'}
  const p=pctOf(w);if(p===100&&(w.steps||[]).length)return'done';if(w.due&&w.due<todayISO())return'late';if(p===0)return'new';return'prog';
}
const doneAt=w=>{if(w.completed_at)return tsMs(w.completed_at);if(isFlow(w)){const e=eff(w);if(e.stage==='done'&&e.dl)return D(e.dl).getTime()}return 0};
const keyDate=w=>(isFlow(w)?eff(w).dl:w.due)||'9';
function rem(dl){const n=dayDiff(todayISO(),dl);if(n>1)return'باقي '+n+' يوم';if(n===1)return'ينتهي غدًا';if(n===0)return'ينتهي اليوم';return'متأخر '+(-n)+' يوم'}
function dlText(e){
  if(e.stage==='done')return e.auto?'اكتملت بانتهاء مهلة الاعتراض':'مكتملة';
  if(e.stage==='rejected')return e.auto?'انتهت المهلة':'مرفوض';
  if(!e.dl)return e.base==='offer'?'بانتظار إرسال العرض':'أدخل تاريخ المرحلة السابقة';
  if(e.wait)return'انتهت مهلة الاعتراض — أكّد الإكمال';
  return rem(e.dl);
}

async function tplSave(){

    const label=(f.label||'').trim();

    if(Object.entries(TYPES).some(([k,v])=>k!==f.type&&v.label===label)){toast('فيه نوع عمل بنفس الاسم');return}
    if(!f.steps.length){toast('أضف مرحلة واحدة على الأقل');return}
    const list=customTypes().map(x=>({...x}));
    if(isNew&&list.length>=20){toast('وصلت الحد الأعلى للأنواع المضافة (20)');return}
    const k=isNew?'c_'+Date.now().toString(36):f.type,row={k,label,steps:[...f.steps]},i=list.findIndex(x=>x.k===k);
    if(i>=0)list[i]=row;else list.push(row);
    if(!(await saveCustom(list)))return;
    f.type=k;f.label=label;toast(isNew?'تمت إضافة النوع: '+label:'تم حفظ النوع: '+label);drawTpl();return;

}

const ML={received:'الاستلام',offer:'إرسال العرض',accepted:'قبول العميل',paid:'الدفع',expert:'تعيين الخبير',report:'التقرير الأولي',objected:'الاعتراض',returned:'إرجاع الشيخ',final:'التقرير النهائي',done:'الاكتمال',approved:'اعتماد الشيخ'};
const MK=Object.keys(ML);
const RULE={'offer>accepted':d=>addWork(d,5),'accepted>paid':d=>addWork(d,10),'paid>expert':d=>addWork(d,10),'expert>report':d=>addDays(d,30),'objected>final':d=>addWork(d,10),'returned>final':d=>addWork(d,10)};
const TLPAL=['#13406F','#1F5E9E','#4C86C6','#7FA9D8','#5B7A99','#2E6F9E','#0B2545'];
function timeline(w){
  const d={...(w.flow.dates||{}),received:w.received},e=eff(w);
  const ms=MK.filter(k=>d[k]).map(k=>({k,d:d[k]})).sort((a,b)=>a.d.localeCompare(b.d)||MK.indexOf(a.k)-MK.indexOf(b.k));
  const segs=[];
  for(let i=1;i<ms.length;i++){const a=ms[i-1],b=ms[i],r=RULE[a.k+'>'+b.k];segs.push({l:ML[a.k]+' ← '+ML[b.k],n:dayDiff(a.d,b.d),late:r?Math.max(0,dayDiff(r(a.d),b.d)):0})}
  const open=e.stage!=='done'&&e.stage!=='rejected'&&!w.cancelled_at;
  if(ms.length&&open){const a=ms[ms.length-1],t=todayISO();if(t>=a.d)segs.push({l:FL[e.base]+' (جارية)',n:dayDiff(a.d,t),late:e.dl&&!e.wait?Math.max(0,dayDiff(e.dl,t)):0,now:true})}
  if(!segs.length)return'';
  const tot=segs.reduce((s,x)=>s+x.n,0);
  const col=(x,i)=>x.late?'var(--red)':x.now?'var(--gold)':TLPAL[i%TLPAL.length];
  return`<div class="card"><div class="row"><b>الخط الزمني</b><span class="meta">المدة الكلية: <b>${tot}</b> يوم</span></div>
  <div class="tl">${segs.map((x,i)=>`<i style="flex:${Math.max(x.n,tot*0.04)||1};background:${col(x,i)}"></i>`).join('')}</div>
  ${segs.map((x,i)=>`<div class="tlr"><i style="background:${col(x,i)}"></i><span>${esc(x.l)}</span>${x.late?`<em>تأخر ${x.late} يوم</em>`:''}<b>${x.n} يوم</b></div>`).join('')}
  <div class="meta" style="margin-top:6px">من ${fmtD(ms[0].d)} إلى ${open?'اليوم':fmtD(ms[ms.length-1].d)}</div></div>`;
}

const PRICE0={case:0,report:0,fs:0,tax:0,med:1.4,big:2,cx:1.3,urg:1.2,party:10,year:8};
const PLBL={case:'أساس القضية المحاسبية (ريال)',report:'أساس التقرير (ريال)',fs:'أساس مراجعة القوائم لكل سنة (ريال)',tax:'أساس الإقرار الضريبي الواحد (ريال)',med:'معامل حجم المستندات: متوسط',big:'معامل حجم المستندات: كبير',cx:'معامل العمل المعقّد',urg:'معامل الاستعجال',party:'زيادة لكل طرف إضافي بعد اثنين (%)',year:'زيادة لكل سنة مالية إضافية في القضية (%)'};
const priceCfg=()=>({...PRICE0,...(S.tpl.pricing&&!Array.isArray(S.tpl.pricing)?S.tpl.pricing:{})});
const nf=n=>Math.round(n).toLocaleString('en-US');
const PFLD={case:['med','big','cx','urg','party','year'],report:['med','big','cx','urg'],fs:['med','big','cx','urg'],tax:['urg']};
const pfor=(c,t)=>{const o={base:c[t]};PFLD[t].forEach(k=>{const v=c.f&&c.f[t]?c.f[t][k]:undefined;o[k]=typeof v==='number'?v:c[k]});return o};
function calcPrice(f,c){
  const k=pfor(c,f.type),sz=f.size==='b'?k.big:f.size==='m'?k.med:1;let p;
  if(f.type==='case')p=k.base*sz*(1+k.party/100*Math.max(0,f.parties-2))*(1+k.year/100*Math.max(0,f.years-1));
  else if(f.type==='report')p=k.base*sz;
  else if(f.type==='fs')p=k.base*Math.max(1,f.years)*sz;
  else p=k.base*Math.max(1,f.count);
  if(f.cx&&f.type!=='tax')p*=k.cx;
  if(f.urg)p*=k.urg;
  return p;
}
function calcEdit(){
  const f=S.sheet;f.edit=!f.edit;
  if(f.edit){const c=priceCfg();f.draft={};Object.keys(PFLD).forEach(t=>f.draft[t]=pfor(c,t))}
  drawCalc();
}

/* ---------- الملفات (تنحفظ مشفّرة على استضافة الشركة) ---------- */
const FILES_URL='https://abnadvisory.com/abnfiles/api.php',FMAX=500*1024*1024,FCH=2*1024*1024;
const fSize=n=>{n=+n||0;return n<1024?n+' بايت':n<1048576?Math.round(n/1024)+' ك.ب':n<1073741824?(n/1048576).toFixed(n<10485760?1:0)+' م.ب':(n/1073741824).toFixed(2)+' ج.ب'};
const hex32=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');
const FJ=b=>({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const wait=ms=>new Promise(z=>setTimeout(z,ms));
async function fTok(){try{const {data}=await sb.auth.getSession();return data?.session?.access_token||''}catch(e){return''}}
async function fApi(a,q,opt){
  try{const r=await fetch(FILES_URL+'?a='+a+(q||''),{...(opt||{}),headers:{'X-Abn-Token':await fTok(),...((opt&&opt.headers)||{})}});let j={};try{j=await r.json()}catch(e){}return{status:r.status,j:j||{}}}
  catch(e){return{status:0,j:{}}}
}
function upAdd(kind,ref,files,done){
  let n=0;
  for(const f of files){
    if(!f.size){toast('الملف فاضي: '+f.name);continue}
    if(f.size>FMAX){toast('الملف أكبر من 500 ميجا: '+f.name);continue}
    UPQ.push({kind,ref,file:f,name:f.name,size:f.size,sent:0,done});n++;
  }
  if(n){upDraw();upNext()}
  return n;
}
async function upNext(){
  if(UPC||!UPQ.length)return;
  const u=UPC=UPQ.shift();u.u=hex32();upDraw();
  let ok=false;try{ok=await upRun(u)}catch(e){ok=false}
  UPC=null;
  if(ok)toast('تم رفع: '+u.name);else toast(u.stop?'تم إلغاء الرفع':(u.err||('تعذر رفع: '+u.name)));
  if(u.done)try{u.done(ok,u)}catch(e){}
  upDraw();upNext();
}
async function upRun(u){
  let off=0,fails=0;
  while(off<u.size){
    if(u.stop)return false;
    const r=await fApi('chunk','&u='+u.u+'&o='+off,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:u.file.slice(off,Math.min(off+FCH,u.size))});
    if(r.status===200&&r.j.ok&&r.j.size>off){off=r.j.size;fails=0;u.sent=off;upDraw();continue}
    if(r.status===401){u.err='انتهت الجلسة، سجّل دخولك من جديد';return false}
    if(r.status===507){u.err='مساحة التخزين امتلأت، بلّغ المدير';return false}
    if(r.status===413){u.err='الملف أكبر من الحد المسموح';return false}
    if(r.status===409&&r.j.error==='offset'&&typeof r.j.size==='number'&&r.j.size!==off&&r.j.size<=u.size){off=r.j.size;u.sent=off;upDraw();continue}
    if(++fails>6){u.err='انقطع الاتصال أثناء رفع: '+u.name;return false}
    await wait(1500*fails);
    const st=await fApi('stat','&u='+u.u);
    if(st.status===200&&typeof st.j.size==='number'&&st.j.size<=u.size){off=st.j.size;u.sent=off;upDraw()}
  }
  if(u.stop)return false;
  for(let i=0;i<3;i++){
    const f=await fApi('finish','',FJ({u:u.u,kind:u.kind,ref:u.ref,name:u.name,size:u.size}));
    if(f.status===200&&f.j.ok)return true;
    if(f.status===404&&i>0)return true;
    if(f.status===0){await wait(2000);continue}
    u.err=f.status===502?'تعذر تسجيل الملف: ما عندك صلاحية أو العهدة مقيّدة':f.status===401?'انتهت الجلسة، سجّل دخولك من جديد':'تعذر إكمال رفع: '+u.name;return false;
  }
  u.err='انقطع الاتصال قبل إكمال رفع: '+u.name;return false;
}
function upHtml(kind,ref){
  const cur=UPC&&UPC.kind===kind&&UPC.ref===ref?UPC:null,q=UPQ.filter(x=>x.kind===kind&&x.ref===ref);
  const p=cur?Math.min(100,Math.floor(cur.sent/cur.size*100)):0;
  return(cur?`<div class="drow"><label><b>جاري الرفع ${p}%</b> · <span style="word-break:break-word">${esc(cur.name)}</span><div class="bar" style="margin:6px 0 0"><i style="width:${p}%"></i></div></label><button class="dclr" data-act="upstop">إلغاء</button></div>`:'')+q.map(x=>`<div class="drow"><label class="meta">بالانتظار · ${esc(x.name)}</label></div>`).join('');
}

function arm(btn,label,orig,fn){if(btn.classList.contains('arm')){fn();return}btn.classList.add('arm');btn.textContent=label;clearTimeout(armT);armT=setTimeout(()=>{btn.classList.remove('arm');btn.textContent=orig},3000)}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-open],[data-act],[data-step],[data-rmstep],[data-rmdraft],[data-st],[data-delann],[data-ftype],[data-fact],[data-clr],[data-tplrm],[data-tplup],[data-tpltype],[data-ctype],[data-csize],[data-ctog],[data-men],[data-restore],[data-purge],[data-tdone],[data-tdel],[data-remdel],[data-aseg],[data-ap],[data-creason],[data-bsz],[data-btog],[data-ty],[data-yr],[data-fopen],[data-fdel],[data-expatt],[data-exppost],[data-expdel],[data-exfrm]');if(!t)return;
  const d=t.dataset;
  if(d.fopen){fOpen(d.fopen,d.fk==='expense'?'expense':'work');return}
  if(d.fdel){arm(t,'تأكيد','حذف',()=>fDel(d.fdel,d.fk==='expense'?'expense':'work'));return}
  if(d.expatt){const id=d.expatt;fPick(fs=>upAdd('expense',id,fs,()=>loadExp()),'image/*,application/pdf');return}
  if(d.exppost){const x=(EX.rows||[]).find(r=>r.id===d.exppost);if(x&&x.posted_at)arm(t,'تأكيد الإلغاء','إلغاء القيد',()=>expPost(d.exppost));else expPost(d.exppost);return}
  if(d.expdel){arm(t,'تأكيد الحذف','حذف العهدة',()=>expDel(d.expdel));return}
  if(d.exfrm!==undefined&&S.sheet?.kind==='expform'){S.sheet.files.splice(+d.exfrm,1);drawExpFiles();return}
    if(d.men){menAdd(d.men);return}
  if(d.ty){S.ty=d.ty;drawList();return}
  if(d.yr){const b=t.classList.contains('abtn');S.yrs[d.yr]=b;drawList();return}
  if((d.bsz||d.btog)&&S.sheet?.bedit){briefRead();const v=S.sheet.bd;if(d.bsz)v.docs=v.docs===d.bsz?'':d.bsz;else v[d.btog]=!v[d.btog];const el=$('#dBrief'),w0=S.works.find(x=>x.id===S.sheet.id);if(el&&w0)el.innerHTML=briefHtml(w0);return}
  if(d.creason&&S.sheet?.kind==='detail'){S.sheet.cr=d.creason;refreshDetail();return}
  if(d.aseg){setSeg(d.aseg);return}
  if(d.remdel){arm(t,'تأكيد','حذف',()=>remDel(+d.remdel));return}
  if(d.tdone){taskToggle(d.tdone);return}
  if(d.tdel){arm(t,'تأكيد','حذف',()=>taskDel(d.tdel));return}
  if(d.restore){trashRestore(d.restore);return}
  if(d.purge){arm(t,'تأكيد الحذف النهائي','حذف نهائي',()=>trashPurge(d.purge));return}
  if(d.ctype){S.sheet.type=d.ctype;drawCalc();return}
  if(d.csize){S.sheet.size=d.csize;drawCalc();return}
  if(d.ctog){S.sheet[d.ctog]=!S.sheet[d.ctog];drawCalc();return}
  if(d.tpltype){const k=d.tpltype;S.sheet.type=k;if(k==='__new'||!TYPES[k]){S.sheet.type='__new';S.sheet.label='';S.sheet.steps=[]}else{S.sheet.label=TYPES[k].custom?TYPES[k].label:'';S.sheet.steps=[...stepsFor(k)]}drawTpl();return}
  if(d.tplrm!==undefined){S.sheet.steps.splice(+d.tplrm,1);drawTpl();return}
  if(d.tplup!==undefined){const i=+d.tplup,a=S.sheet.steps;[a[i-1],a[i]]=[a[i],a[i-1]];drawTpl();return}
  if(d.clr){const i=t.parentElement.querySelector('input[type=date]');if(i&&i.value){i.value='';i.dispatchEvent(new Event('change',{bubbles:true}))}return}
  if(d.tab){if(S.sheet)closeSheet();S.tab=d.tab;if(S.tab==='ann'){if(S.annSeg==='ann')ls('abn_ann_seen',String(Date.now()));else markSeenG()}window.scrollTo(0,0);renderAll();if(S.tab==='ann'&&S.annSeg==='chat')loadGChat();if(S.tab==='exp')loadExp();return}
  if(d.st){S.st=d.st;S.yrs={};document.querySelectorAll('.chips .chip[data-st]').forEach(b=>b.classList.toggle('on',b.dataset.st===S.st));if(t.scrollIntoView)t.scrollIntoView({inline:'center',block:'nearest'});drawList();return}
  if(d.open){openDetail(d.open);return}
  if(d.ftype){S.sheet.type=d.ftype;S.sheet.steps=[...stepsFor(d.ftype)];drawForm();return}
  if(d.rmdraft!==undefined){S.sheet.steps.splice(+d.rmdraft,1);drawForm();return}
  if(d.delann){arm(t,'تأكيد الحذف','حذف',async()=>{const {error}=await sb.from('announcements').delete().eq('id',d.delann);toast(error?'تعذر الحذف':'تم الحذف');load()});return}
  const w=S.sheet?.kind==='detail'?S.works.find(x=>x.id===S.sheet.id):null;
  if(d.fact!==undefined&&w&&isFlow(w)){
    const a=actsFor(w)[+d.fact];if(!a)return;
    if(Date.now()-factT<900)return;factT=Date.now();
    const dt=$('#adate')?.value||todayISO();
    if(a[2]==='approved'){const dn=(w.flow.dates||{}).done;if(dn&&dt<dn){toast('تاريخ الاعتماد قبل تاريخ الاكتمال ('+fmtD(dn)+')');return}}
    if(a[1]!=='reopen'){const pk=PREVK[w.flow.stage],pv=pk==='received'?w.received:(w.flow.dates||{})[pk];if(pv&&dt<pv){toast('تاريخ الإجراء قبل تاريخ المرحلة السابقة ('+fmtD(pv)+')');return}}const f=JSON.parse(JSON.stringify(w.flow));f.dates=f.dates||{};
    if(a[1]==='reopen'){f.stage=f.prev||'accept';delete f.prev;delete f.reason;delete f.dates.rejected;f.reopened=dt}
    else{
      if(a[1]==='rejected'){f.prev=f.stage;f.reason=a[0]}
      f.dates[a[2]]=dt;
      if(a[1]==='done'&&a[2]!=='approved')f.dates.done=dt;
      if(a[1]==='revise'){delete f.dates.done;delete f.dates.approved}
      f.stage=a[1];
    }
    if(await updateWork(w.id,a[2]==='approved'?{flow:f,hearing:null}:{flow:f}))toast(a[2]==='approved'?'تم تسجيل اعتماد الشيخ للتقرير':a[1]==='reopen'?'تمت إعادة فتح العرض':'انتقلت إلى: '+FL[f.stage]);
    return;
  }
  if(d.step!==undefined&&w){const steps=(w.steps||[]).map(x=>({...x}));const s=steps[+d.step];if(!s)return;s.done=!s.done;if(s.done){s.at=new Date().toISOString();s.by=myId()}else{delete s.at;delete s.by}local(w.id,withCompletion(w,steps));if(steps.every(x=>x.done))toast('اكتمل العمل 100%');rpc('set_step',{p_work:w.id,p_idx:+d.step,p_done:s.done});return}
  if(d.rmstep!==undefined&&w){arm(t,'حذف؟','×',()=>{const i=+d.rmstep;local(w.id,withCompletion(w,w.steps.filter((_,k)=>k!==i)));rpc('remove_step',{p_work:w.id,p_idx:i})});return}
  switch(d.act){
    case'close':closeSheet();break;
    case'fpick':if(w){const id=w.id;fPick(fs=>upAdd('work',id,fs,ok=>{if(ok&&S.sheet?.kind==='detail'&&S.sheet.id===id)loadFiles(id)}))}break;
    case'upstop':if(UPC)UPC.stop=true;break;
    case'expprev':expMonth(-1);break;
    case'expnext':expMonth(1);break;
    case'expfpick':if(S.sheet?.kind==='expform')fPick(fs=>{if(S.sheet?.kind!=='expform')return;for(const f of fs){if(!f.size)continue;if(f.size>FMAX){toast('الملف أكبر من 500 ميجا: '+f.name);continue}S.sheet.files.push(f)}drawExpFiles()},'image/*,application/pdf');break;
    case'expsave':expSave();break;
    case'expxl':expXl();break;
    case'expxlsave':expXlSave();break;
      case'account':openAccount();break;
    case'qk':qkOpen();break;
    case'log':openLog();break;
    case'pass':openPass();break;
    case'sendmsg':sendMsg();break;
    case'backup':backup();break;
    case'bksave':bkSave();break;
    case'push':openPush();break;
    case'calc':openCalc();break;
    case'calcedit':calcEdit();break;
    case'calcsave':calcSave();break;
    case'calcback':{const id=S.sheet&&S.sheet.from;if(id)openDetail(id);break}
    case'briefedit':if(w)briefEdit(w);break;
    case'briefx':if(w){S.sheet.bedit=false;refreshDetail()}break;
    case'briefsave':if(w)briefSave(w);break;
    case'briefcalc':if(w)briefCalc(w);break;
    case'pushon':pushOn();break;
    case'pushoff':pushOff();break;
    case'tpl':openTpl();break;
    case'tplsave':tplSave();break;
    case'tpldel':{const k=S.sheet.type,n=S.works.filter(x=>x.type===k).length;if(n){toast('ما ينحذف: فيه '+n+' عمل من هذا النوع');break}arm(t,'اضغط مرة ثانية للتأكيد','حذف هذا النوع',async()=>{if(await saveCustom(customTypes().filter(x=>x.k!==k))){toast('تم حذف النوع');S.sheet.type='report';S.sheet.label='';S.sheet.steps=[...stepsFor('report')];drawTpl()}});break}
    case'tpladd':{const i=$('#tplstep');const v=i.value.trim();if(v){S.sheet.steps.push(v);i.value='';drawTpl()}break}
    case'logout':closeSheet();await pushDrop();await sb.auth.signOut();break;
    case'tipoff':ls('abn_tip_off','1');renderView();break;
    case'fstep':{const i=$('#fstep');const v=i.value.trim();if(v){S.sheet.steps.push(v);i.value='';drawForm()}break}
    case'addstep':{const i=$('#nstep');const v=i.value.trim();if(!v||!w)break;i.value='';local(w.id,withCompletion(w,[...(w.steps||[]),{t:v,done:false}]));rpc('add_step',{p_work:w.id,p_text:v});break}
    case'editwork':if(w)openWorkForm(w.id);break;
    case'cancelw':if(w){S.sheet.cbox=true;S.sheet.cr=null;refreshDetail();const ci=$('#c_r');if(ci&&ci.scrollIntoView)ci.scrollIntoView({block:'center'})}break;
    case'cancelx':if(w){S.sheet.cbox=false;S.sheet.cr=null;refreshDetail()}break;
    case'cancelgo':if(w)cancelGo(w);break;
    case'reopenw':if(w)arm(t,'اضغط مرة ثانية للتأكيد','إعادة فتح العمل',async()=>{if(await updateWork(w.id,{cancelled_at:null,cancelled_by:null,cancel_reason:null}))toast('تمت إعادة فتح العمل')});break;
    case'delwork':if(w)arm(t,'اضغط مرة ثانية للتأكيد','حذف',async()=>{const id=w.id;closeSheet();const {error}=await sb.from('works').update({deleted_at:new Date().toISOString(),deleted_by:myId()}).eq('id',id);toast(error?'تعذر الحذف':'نُقل العمل إلى سلة المحذوفات (يُسترجع خلال 30 يومًا)');load()});break;
    case'trash':openTrash();break;
    case'gsend':gSend();break;
    case'gopen':S.tab='ann';window.scrollTo(0,0);setSeg('chat');break;
    case'rem':openRem();break;
    case'remadd':remAdd();break;
    case'taskadd':taskAdd();break;
    case'tasktoggle':S.tkDone=!S.tkDone;drawTasks();break;
    case'taskclear':arm(t,'اضغط مرة ثانية للتأكيد','مسح المهام المنجزة',()=>taskClear());break;
    case'update':applyUpdate(true);break;
    case'logoutall':arm(t,'اضغط مرة ثانية للتأكيد','خروج من كل الأجهزة',async()=>{closeSheet();await pushDrop();await sb.auth.signOut({scope:'global'})});break;
  }
});
document.addEventListener('change',e=>{
  const k=e.target.dataset?.fdate;if(!k)return;
  const w=S.sheet?.kind==='detail'?S.works.find(x=>x.id===S.sheet.id):null;if(!w||!isFlow(w))return;
  const v=e.target.value||null;
  if(k==='received'){updateWork(w.id,{received:v});return}
  const f=JSON.parse(JSON.stringify(w.flow));f.dates=f.dates||{};if(v)f.dates[k]=v;else delete f.dates[k];
  updateWork(w.id,{flow:f});
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;drawList()}if(e.target.id==='tlabel'&&S.sheet?.kind==='tpl')S.sheet.label=e.target.value;const g=e.target.dataset?.cfg;if(g&&S.sheet?.draft){const v=parseFloat(e.target.value);if(!isNaN(v)&&v>=0)S.sheet.draft[S.sheet.type][g]=v}const k=e.target.dataset?.cnum;if(k&&S.sheet?.kind==='calc'){const v=parseInt(e.target.value,10);S.sheet[k]=isNaN(v)?1:Math.max(1,Math.min(99,v));drawRes()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='nstep'||e.target.id==='fstep')){e.preventDefault();document.querySelector(e.target.id==='nstep'?'[data-act=addstep]':'[data-act=fstep]').click()}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
$('#fab').addEventListener('click',()=>{S.tab==='ann'?openAnnForm():S.tab==='exp'?openExpForm():openWorkForm()});
</script>
</body>
</html>
