<style>
:root{--navy:#0B2545;--blue:#13406F;--blue2:#1F5E9E;--gold:#C9A24A;--gold2:#E8D29B;--bg:#F3F5F9;--ink:#14213D;--mute:#6B7891;--line:#E3E8F0;--red:#B42318;--green:#147D45;--amber:#B45309;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'IBM Plex Sans Arabic',-apple-system,system-ui,sans-serif;color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(90px + var(--sb))}
.hidden{display:none!important}
/* login */
#login{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;justify-content:center;padding:26px;padding-top:calc(26px + var(--st));overflow:hidden;z-index:60}
#login .bigN{position:absolute;top:40px;left:-40px;font:800 360px/1 Georgia,serif;color:rgba(201,162,74,.07);pointer-events:none}
.lbox{max-width:420px;width:100%;margin:0 auto;position:relative}
.llogo{width:66px;height:66px;border-radius:18px;background:linear-gradient(135deg,#D9B562,#A8822F);display:grid;place-items:center;margin:0 auto;font:800 34px Georgia,serif;color:var(--navy)}
.lbrand{color:#fff;font-size:30px;font-weight:700;text-align:center;margin-top:14px;direction:ltr}
.lsub{color:var(--gold2);font-size:13px;text-align:center;margin:2px 0 28px;direction:ltr}
.lcard{background:var(--bg);border-radius:20px;padding:18px}
.lfoot{color:#8FA3C0;text-align:center;margin-top:26px;font-size:13px}
/* header */
.top{background:var(--navy);color:#fff;padding:calc(14px + var(--st)) 18px 58px;position:relative;overflow:hidden}
.top .bgN{position:absolute;left:-14px;top:-48px;font:700 210px/1 Georgia,serif;color:rgba(201,162,74,.08);pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;position:relative}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#D9B562,#A8822F);display:grid;place-items:center;font:700 21px Georgia,serif;color:var(--navy)}
.brand b{font-size:17px;display:block;direction:ltr;text-align:right}
.brand small{display:block;font-size:10.5px;color:var(--gold2);direction:ltr}
.avatar{margin-inline-start:auto;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:700;border:1px solid rgba(201,162,74,.6);color:#fff}
.hello{margin-top:18px;position:relative}
.hello p{font-size:12.5px;color:#B8C7DD}
.hello h1{font-size:21px;font-weight:700;margin-top:2px}
main{padding:0 14px;margin-top:-40px;position:relative}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(11,37,69,.05),0 6px 18px rgba(11,37,69,.06);margin-bottom:12px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 10px}
.sec h2{font-size:15.5px;font-weight:700}
.sec button{font-size:13px;color:var(--blue2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.big{font-size:30px;font-weight:800;color:var(--navy)}
.nums{display:flex;gap:8px;margin-top:6px}
.num{flex:1;background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center}
.num b{display:block;font-size:20px;font-weight:800}
.num span{font-size:11.5px;color:var(--mute)}
.bar{height:7px;background:#EDF0F5;border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;border-radius:9px;background:var(--blue2);transition:width .3s}
.bar.done i{background:var(--green)}.bar.late i{background:var(--red)}.bar.gold i{background:var(--gold)}
.goldEdge{border-inline-start:4px solid var(--gold)}
.k{font-size:11.5px;color:var(--amber);font-weight:700}
.wcard{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(11,37,69,.05),0 4px 12px rgba(11,37,69,.05);cursor:pointer}
.wcard:active{transform:scale(.985)}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.type{background:#EAF1FA;color:var(--blue)}
.st-new{background:#EEF0F4;color:#55617A}.st-prog{background:#E7F0FB;color:var(--blue2)}.st-late{background:#FDECEA;color:var(--red)}.st-done{background:#E6F4EC;color:var(--green)}
.wcard h3{font-size:15.5px;font-weight:700;margin:9px 0 2px;line-height:1.5}
.meta{font-size:12.5px;color:var(--mute)}
.meta b{color:var(--ink)}
.hear{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hear:last-child{border:0}
.cal{flex:none;width:48px;text-align:center;border-radius:10px;background:var(--navy);color:#fff;padding:5px 0;line-height:1.2}
.cal b{display:block;font-size:17px}.cal small{font-size:10.5px;color:var(--gold2)}
.empty{text-align:center;color:var(--mute);padding:20px 8px;line-height:1.8}
.seg{display:flex;background:#fff;border-radius:12px;padding:4px;margin-bottom:10px;box-shadow:0 1px 2px rgba(11,37,69,.06)}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--navy);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:12.5px;color:#3d4a63}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.input,.f input,.f select,.f textarea{display:block;width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:#fff;outline:none;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
.input:focus,.f input:focus,.f textarea:focus{border-color:var(--blue2)}
.f textarea{min-height:120px;resize:vertical;line-height:1.7}
.lbl{display:block;font-size:12.5px;color:var(--mute);margin:0 0 6px;font-weight:600}
.f .fld{margin-bottom:12px}
.primary{width:100%;padding:14px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:15px}
.primary:disabled{opacity:.6}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + var(--sb));z-index:20}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:#8A95AA;position:relative}
.tabs button.on{color:var(--navy);font-weight:700}
.tabs svg{width:23px;height:23px;stroke:#8A95AA;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on svg{stroke:var(--gold)}
.badge{position:absolute;top:-4px;left:calc(50% - 22px);background:var(--red);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.fab{position:fixed;bottom:calc(92px + var(--sb));left:max(18px,calc(50% - 242px));width:58px;height:58px;border-radius:18px;background:var(--gold);display:grid;place-items:center;box-shadow:0 8px 20px rgba(201,162,74,.45);z-index:21}
.fab svg{width:28px;height:28px;stroke:var(--navy);stroke-width:2.4;fill:none;stroke-linecap:round}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(11,37,69,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:10px 16px calc(28px + var(--sb));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:5px;background:#CBD3DF;margin:2px auto 12px}
.x{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;color:var(--mute)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.info div{background:#fff;border-radius:12px;padding:10px 12px}

<script>
const SUPABASE_URL='https://jlckgijotdfozhvffqxx.supabase.co';
const SUPABASE_KEY='sb_publishable_6ZQjo2e3Cl-FXgg95-V8bA_uw9eql4a';
if(!window.supabase){document.body.innerHTML='<div style="padding:60px 24px;text-align:center;font:16px/1.9 system-ui;color:#0B2545"><b>تعذر تحميل التطبيق</b><br>تأكد من اتصال الإنترنت ثم أغلق التطبيق وافتحه من جديد.</div>';throw new Error('supabase library not loaded')}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});

const TYPES={
  case:{label:'قضية محاسبية',steps:[]},
  fs:{label:'مراجعة قوائم مالية',steps:['خطاب الارتباط','التخطيط وتقييم المخاطر','جمع المستندات','الاختبارات والإجراءات','مسودة القوائم والإيضاحات','المراجعة النهائية','إصدار التقرير']},
  report:{label:'تقرير',steps:['تحديد النطاق','جمع البيانات','التحليل','المسودة','المراجعة','التسليم']},
  tax:{label:'إقرار ضريبي',steps:['استلام البيانات','مطابقة الحسابات','إعداد الإقرار','مراجعة الإقرار','تقديم الإقرار','الإقفال']},
  other:{label:'أخرى',steps:['البدء','التنفيذ','المراجعة','التسليم']}
};
/* مسار القضية المحاسبية */
const FLOW=[['offer','استلام القضية وإرسال التسعير'],['accept','انتظار قبول العميل'],['pay','انتظار الدفع'],['expert','تعيين الخبير'],['report','إعداد التقرير الأولي'],['objection','مهلة الاعتراض'],['revise','تعديل التقرير وإرسال النهائي'],['done','مكتملة']];
const FL=Object.fromEntries(FLOW);FL.rejected='العروض المرفوضة';
const PCT={offer:5,accept:15,pay:30,expert:45,report:60,objection:80,revise:90,done:100,rejected:0};
/* [نص الزر، المرحلة التالية، التاريخ الذي يُسجَّل] */
const ACTS={
  offer:[['تم إرسال العرض للعميل','accept','offer']],
  accept:[['العميل قبل العرض','pay','accepted'],['لم يتم اختيارنا','rejected','rejected']],
  pay:[['تم الدفع','expert','paid'],['العميل لم يدفع','rejected','rejected']],
  expert:[['تم تعيين الخبير','report','expert']],
  report:[['تم إرسال التقرير الأولي','objection','report']],
  objection:[['لا يوجد اعتراض — إكمال القضية','done','done'],['يوجد اعتراض على التقرير','revise','objected'],['الشيخ أرجع التقرير','revise','returned']],
  revise:[['تم إرسال التقرير النهائي','done','final']],
  done:[['الشيخ أرجع التقرير','revise','returned']],
  rejected:[['إعادة فتح العرض','reopen','']]
};
const FDATES=[['received','استلام القضية'],['offer','إرسال العرض'],['accepted','قبول العميل'],['paid','الدفع'],['expert','تعيين الخبير'],['report','إرسال التقرير الأولي'],['objected','الاعتراض'],['returned','إرجاع الشيخ للتقرير'],['final','إرسال التقرير النهائي'],['done','الاكتمال']];
const NEED={offer:1,accepted:2,paid:3,expert:4,report:5};
const ST={new:{l:'لم يبدأ',c:'st-new'},prog:{l:'قيد التنفيذ',c:'st-prog'},late:{l:'متأخر',c:'st-late'},done:{l:'مكتمل',c:'st-done'},rej:{l:'مرفوض',c:'st-rej'}};
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const S={session:null,me:null,works:[],anns:[],profiles:[],loaded:false,err:null,tab:'home',st:'all',q:'',sheet:null,act:null,msgs:[],chat:null,tpl:{}};

const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>toISO(new Date());
const D=iso=>new Date(iso+'T12:00:00');
const addDays=(iso,n)=>{const d=D(iso);d.setDate(d.getDate()+n);return toISO(d)};
/* أيام العمل: بدون الجمعة والسبت */
const addWork=(iso,n)=>{const d=D(iso);while(n>0){d.setDate(d.getDate()+1);const g=d.getDay();if(g!==5&&g!==6)n--}return toISO(d)};
const dayDiff=(a,b)=>Math.round((D(b)-D(a))/864e5);
const fmtD=iso=>{if(!iso)return'—';const[y,m,d]=iso.split('-').map(Number);return d+' '+MONTHS[m-1]+' '+y};
const parseTS=ts=>typeof ts==='string'?new Date(ts.replace(/(\.\d{3})\d+/,'$1').replace(' ','T')):new Date(ts);
const tsMs=ts=>{const n=parseTS(ts).getTime();return isNaN(n)?0:n};
const fmtDT=ts=>{if(!ts)return'';const d=parseTS(ts);if(isNaN(d))return'';return d.getDate()+' '+MONTHS[d.getMonth()]+' · '+pad(d.getHours())+':'+pad(d.getMinutes())};
const typeL=t=>(TYPES[t]||TYPES.other).label;
const myId=()=>S.session?.user?.id;
const isAdmin=()=>S.me?.role==='admin';
const nm=id=>!id?'النظام':id===myId()?'أنت':(S.profiles.find(p=>p.id===id)?.full_name||'موظف');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2300)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

/* ---------- منطق المسار ---------- */
const isFlow=w=>w.type==='case'&&!!(w.flow&&w.flow.stage);
function eff(w){
  const f=w.flow,s=f.stage,d=f.dates||{};let dl=null;
  const ro=a=>a&&f.reopened&&f.reopened>a?f.reopened:a;
  if(s==='accept')dl=d.offer?addWork(ro(d.offer),5):null;
  else if(s==='pay')dl=d.accepted?addWork(ro(d.accepted),10):null;
  else if(s==='expert')dl=d.paid?addWork(d.paid,10):null;
  else if(s==='report')dl=d.expert?addDays(d.expert,30):(w.due||null);
  else if(s==='objection')dl=d.report?addWork(d.report,5):null;
  else if(s==='revise'){const b=[d.objected,d.returned].filter(Boolean).sort().pop();dl=b?addWork(b,10):null}
  let stage=s,auto=false;
  if(dl&&todayISO()>dl){if(s==='accept'||s==='pay'){stage='rejected';auto=true}else if(s==='objection'){stage='done';auto=true}}
  return{stage,base:s,auto,dl};
}
const pctOf=w=>{if(isFlow(w))return PCT[eff(w).stage]??0;const s=w.steps||[];return s.length?Math.round(s.filter(x=>x.done).length*100/s.length):0};
function statusOf(w){
  if(isFlow(w)){const e=eff(w);if(e.stage==='done')return'done';if(e.stage==='rejected')return'rej';if(e.dl&&todayISO()>e.dl)return'late';return e.base==='offer'?'new':'prog'}
  const p=pctOf(w);if(p===100&&(w.steps||[]).length)return'done';if(w.due&&w.due<todayISO())return'late';if(p===0)return'new';return'prog';
}
const doneAt=w=>{if(w.completed_at)return tsMs(w.completed_at);if(isFlow(w)){const e=eff(w);if(e.stage==='done'&&e.dl)return D(e.dl).getTime()}return 0};
const keyDate=w=>(isFlow(w)?eff(w).dl:w.due)||'9';
function rem(dl){const n=dayDiff(todayISO(),dl);if(n>1)return'باقي '+n+' يوم';if(n===1)return'ينتهي غدًا';if(n===0)return'ينتهي اليوم';return'متأخر '+(-n)+' يوم'}
function dlText(e){
  if(e.stage==='done')return e.auto?'اكتملت بانتهاء مهلة الاعتراض':'مكتملة';
  if(e.stage==='rejected')return e.auto?'انتهت المهلة':'مرفوض';
  if(!e.dl)return e.base==='offer'?'بانتظار إرسال العرض':'أدخل تاريخ المرحلة السابقة';
  return rem(e.dl);
}

const IC={
  home:'<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  works:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>',
  ann:'<svg viewBox="0 0 24 24"><path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg>'
};

/* ---------- الدخول ---------- */
$('#lf').addEventListener('submit',async e=>{
  e.preventDefault();const f=new FormData(e.target);const b=$('#lbtn');b.disabled=true;b.textContent='جاري الدخول…';
  const {error}=await sb.auth.signInWithPassword({email:String(f.get('email')).trim(),password:String(f.get('pass'))});
  b.disabled=false;b.textContent='دخول';
  if(error)toast(!error.status||/fetch|network/i.test(error.message||'')?'تعذر الاتصال، تأكد من الإنترنت':'تأكد من الإيميل وكلمة المرور');
});
sb.auth.onAuthStateChange((_e,session)=>{const was=!!S.session;S.session=session;if(!!session!==was||!S.booted){S.booted=true;session?startApp():showLogin()}});
function showLogin(){$('#login').classList.remove('hidden');['#app','#tabs','#fab'].forEach(s=>$(s).classList.add('hidden'));closeSheet()}

/* ---------- البيانات ---------- */
let channel=null,loadTimer=null;
async function load(){
  const [w,a,p]=await Promise.all([
    sb.from('works').select('*').order('created_at',{ascending:false}),
    sb.from('announcements').select('*').order('created_at',{ascending:false}).limit(60),
    sb.from('profiles').select('*').order('full_name')
  ]);
  if(!w.error)S.works=w.data;if(!a.error)S.anns=a.data;if(!p.error)S.profiles=p.data;
  S.err=(w.error||a.error||p.error)?'تعذر تحميل البيانات، تأكد من الاتصال':null;
  S.me=S.profiles.find(x=>x.id===myId())||null;S.loaded=true;renderAll();loadMsgs();loadTpl();openPending();
  if(S.sheet?.kind==='detail')loadAct(S.sheet.id);
}
const loadSoon=()=>{clearTimeout(loadTimer);loadTimer=setTimeout(load,300)};
function startApp(){
  $('#login').classList.add('hidden');['#app','#tabs'].forEach(s=>$(s).classList.remove('hidden'));
  S.loaded=false;renderAll();load();pushSync();
  if(channel)sb.removeChannel(channel);
  channel=sb.channel('abn-web').on('postgres_changes',{event:'*',schema:'public',table:'works'},loadSoon).on('postgres_changes',{event:'*',schema:'public',table:'announcements'},loadSoon).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},onMsg).on('postgres_changes',{event:'*',schema:'public',table:'msg_reads'},onRead).subscribe();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.session)load()});

async function updateWork(id,patch){
  S.works=S.works.map(w=>w.id===id?{...w,...patch}:w);renderAll();
  const {error}=await sb.from('works').update(patch).eq('id',id);
  if(error){toast('تعذر الحفظ');load();return false}
  loadSoon();return true;
}
async function rpc(fn,args){const {error}=await sb.rpc(fn,args);if(error)toast('تعذر الحفظ');load()}
const withCompletion=(w,steps)=>{const all=steps.length>0&&steps.every(x=>x.done);return{steps,completed_at:all?(w.completed_at||new Date().toISOString()):null}};
const local=(id,patch)=>{S.works=S.works.map(w=>w.id===id?{...w,...patch}:w);renderAll()};
async function loadAct(id){
  const {data,error}=await sb.from('activity').select('*').eq('work_id',id).order('created_at',{ascending:false}).limit(40);
  if(error)return;S.act={id,rows:data||[]};drawAct();
}
function drawAct(){
  const el=$('#dAct');if(!el||!S.act||S.act.id!==S.sheet?.id)return;
  el.innerHTML=S.act.rows.length?S.act.rows.map(r=>`<div class="lg"><b>${esc(nm(r.actor))}</b> ${esc(r.action)}<small>${fmtDT(r.created_at)}</small></div>`).join(''):'<div class="meta" style="padding:8px 0">ما فيه نشاط مسجّل بعد.</div>';
}

/* ---------- المحادثة داخل كل عمل ---------- */
function seenMap(){try{return JSON.parse(ls('abn_chat_seen')||'{}')||{}}catch(e){return{}}}
function chatBase(){let b=+(ls('abn_chat_base')||0);if(!b){b=Date.now();ls('abn_chat_base',String(b))}return b}
function unreadOf(id){const s=Math.max(seenMap()[id]||0,chatBase());return S.msgs.filter(m=>m.work_id===id&&m.author!==myId()&&tsMs(m.created_at)>s)}
function markSeen(id){const m=seenMap();m[id]=Date.now();ls('abn_chat_seen',JSON.stringify(m));markRead(id)}
async function loadMsgs(){
  const {data,error}=await sb.from('messages').select('id,work_id,author,created_at,body').order('created_at',{ascending:false}).limit(500);
  if(error)return;S.msgs=data||[];
  if(S.sheet?.kind==='detail')markSeen(S.sheet.id);
  renderNav();if(!S.sheet)renderView();
}
async function loadChat(id){
  const {data,error}=await sb.from('messages').select('*').eq('work_id',id).order('created_at',{ascending:true}).limit(300);
  if(error)return;S.chat={id,rows:data||[],reads:S.chat&&S.chat.id===id?S.chat.reads:null};markSeen(id);renderNav();drawChat(true);loadReads(id);
}
function drawChat(scroll){
  const el=$('#dChat');if(!el||!S.chat||S.chat.id!==S.sheet?.id)return;
  el.innerHTML=S.chat.rows.length?S.chat.rows.map(m=>{const me=m.author===myId();return`<div class="msg ${me?'me':''}"><b>${esc(me?'أنت':nm(m.author))}</b><p>${menHtml(m.body)}</p><small>${fmtDT(m.created_at)}</small>${readLine(m)}</div>`}).join(''):'<div class="meta" style="padding:8px 4px">ما فيه رسائل بعد. اكتب أول رسالة.</div>';
  if(scroll)el.scrollTop=el.scrollHeight;
}
async function sendMsg(){
  const i=$('#nmsg');const v=i.value.trim();const id=S.sheet?.id;if(!v||!id)return;i.value='';
  const {error}=await sb.from('messages').insert({work_id:id,body:v});
  if(error){toast('تعذر الإرسال');i.value=v;return}
  loadChat(id);
}
function onMsg(p){
  const m=(p&&p.new)||{};
  if(S.sheet?.kind==='detail'&&S.sheet.id===m.work_id){loadChat(m.work_id);loadMsgs();return}
  loadMsgs();
  if(m.author&&m.author!==myId()){const w=S.works.find(x=>x.id===m.work_id);const t=w?w.title:'عمل';toast((menMe(m.body)?'📣 '+nm(m.author)+' ذكرك في: ':'💬 '+nm(m.author)+' كتب في: ')+(t.length>28?t.slice(0,28)+'…':t))}
}
function chatAlerts(){
  const rows=S.works.map(w=>[w,unreadOf(w.id)]).filter(x=>x[1].length);
  return rows.length?`<div class="card alertc chatc">${rows.slice(0,8).map(([w,u])=>`<div class="al" data-open="${esc(w.id)}"><b>${u.some(m=>menMe(m.body))?'📣 ذكرك ':'💬 '}${esc([...new Set(u.map(m=>nm(m.author)))].join('، '))}${u.some(m=>menMe(m.body))?' في العمل':' كتب في العمل'} (${u.length})</b><span>${esc(w.title)}</span></div>`).join('')}</div>`:'';
}

/* ---------- من قرأ الرسالة ---------- */
const mrT={};
function markRead(id){if(!id||mrT[id])return;mrT[id]=setTimeout(()=>{delete mrT[id];sb.rpc('mark_read',{p_work:id}).then(()=>{},()=>{})},600)}
async function loadReads(id){
  const {data,error}=await sb.from('msg_reads').select('user_id,seen_at').eq('work_id',id);
  if(error||!S.chat||S.chat.id!==id)return;S.chat.reads=data||[];drawChat(false);
}
function onRead(p){const r=(p&&p.new)||{};if(r.work_id&&r.user_id!==myId()&&S.sheet?.kind==='detail'&&S.sheet.id===r.work_id)loadReads(r.work_id)}
function readLine(m){
  const rs=S.chat&&S.chat.reads;if(!rs)return'';
  const t=tsMs(m.created_at),mine=m.author===myId();
  const names=rs.filter(r=>r.user_id!==m.author&&r.user_id!==myId()&&tsMs(r.seen_at)>=t).map(r=>first(S.profiles.find(p=>p.id===r.user_id)?.full_name)).filter(Boolean);
  if(names.length)return`<span class="rd on">✓✓ قرأها: ${esc(names.join('، '))}</span>`;
  return mine?'<span class="rd">✓ لم تُقرأ بعد</span>':'';
}
/* ---------- المنشن ---------- */
const first=n=>String(n||'').trim().split(/\s+/)[0]||'';
const menMe=b=>{const f=first(S.me?.full_name);return !!f&&String(b||'').includes('@'+f)};
function menRow(){const o=S.profiles.filter(p=>p.id!==myId()&&first(p.full_name));return o.length?`<div class="wrap" style="margin-bottom:6px"><span class="meta" style="align-self:center">منشن:</span>${o.map(p=>`<button class="chip" data-men="${esc(first(p.full_name))}">@${esc(first(p.full_name))}</button>`).join('')}</div>`:''}
function menHtml(b){let h=esc(b);S.profiles.forEach(p=>{const f=first(p.full_name);if(!f)return;const t=esc('@'+f);h=h.split(t).join(`<span class="men${p.id===myId()?' mine':''}">${t}</span>`)});return h}
function menAdd(n){const i=$('#nmsg');if(!i)return;const a=i.selectionStart??i.value.length,v=i.value,pre=v.slice(0,a),t=(pre&&!/\s$/.test(pre)?' ':'')+'@'+n+' ';i.value=pre+t+v.slice(a);i.focus();const c=pre.length+t.length;try{i.setSelectionRange(c,c)}catch(e){}}
/* ---------- قوالب المراحل ---------- */
const stepsFor=t=>(S.tpl[t]&&S.tpl[t].length?S.tpl[t]:TYPES[t].steps);
async function loadTpl(){const {data,error}=await sb.from('templates').select('*');if(error)return;S.tpl=Object.fromEntries((data||[]).map(r=>[r.type,r.steps||[]]));syncTypes()}
const BUILTIN=['case','fs','report','tax','other'];
function customTypes(){const c=S.tpl.custom_types;return Array.isArray(c)?c.filter(x=>x&&x.k&&x.label):[]}
function syncTypes(){
  Object.keys(TYPES).forEach(k=>{if(!BUILTIN.includes(k))delete TYPES[k]});
  customTypes().forEach(c=>{TYPES[c.k]={label:c.label,steps:Array.isArray(c.steps)?c.steps:[],custom:true}});
  if(S.loaded&&!S.sheet)renderView();
}
async function saveCustom(list){
  const {error}=await sb.from('templates').upsert({type:'custom_types',steps:list,updated_at:new Date().toISOString()});
  if(error){toast('تعذر الحفظ');return false}
  S.tpl.custom_types=list;syncTypes();return true;
}
function openTpl(){
  S.sheet={kind:'tpl',type:'report',label:'',steps:[...stepsFor('report')]};
  openSheet(`<div class="row" style="margin-bottom:14px"><h2 style="font-size:18px">أنواع الأعمال وقوالب المراحل</h2><button class="x" data-act="close">×</button></div>
  <div class="notice">اختر نوع العمل وعدّل مراحله ثم اضغط <b>حفظ</b>، أو اضغط <b>＋ نوع جديد</b> لإضافة نوع عمل. التعديل يطبّق على الأعمال الجديدة فقط، والأعمال الحالية تبقى بمراحلها. (القضايا المحاسبية لها مسار ثابت.)</div>
  <div class="wrap" id="ttypes"></div><div id="tname"></div><div id="tsteps" class="card" style="padding:4px 14px"></div>
  <div class="inl" style="margin:0 0 16px"><input class="input" id="tplstep" placeholder="أضف مرحلة" maxlength="80"><button class="sbtn" data-act="tpladd">إضافة</button></div>
  <button class="primary" data-act="tplsave">حفظ</button><div id="tdel"></div>`);
  drawTpl();
}
function drawTpl(){
  const f=S.sheet,isNew=f.type==='__new',cus=isNew||!!(TYPES[f.type]&&TYPES[f.type].custom);
  $('#ttypes').innerHTML=['report','fs','tax','other'].concat(customTypes().map(c=>c.k)).map(k=>`<button class="chip ${f.type===k?'on':''}" data-tpltype="${esc(k)}">${esc(TYPES[k].label)}</button>`).join('')+`<button class="chip ${isNew?'on':''}" data-tpltype="__new">＋ نوع جديد</button>`;
  $('#tname').innerHTML=cus?`<div class="fld"><label class="lbl">اسم نوع العمل</label><input class="input" id="tlabel" maxlength="40" value="${esc(f.label)}" placeholder="مثال: دراسة جدوى"></div>`:'';
  $('#tsteps').innerHTML=f.steps.length?f.steps.map((s,i)=>`<div class="drow"><label>${i+1}. ${esc(s)}</label>${i?`<button class="dclr" style="color:var(--navy)" data-tplup="${i}">↑</button>`:''}<button class="dclr" data-tplrm="${i}">حذف</button></div>`).join(''):'<div class="meta" style="padding:8px 0">ما فيه مراحل. أضف المراحل من الخانة تحت.</div>';
  $('#tdel').innerHTML=cus&&!isNew?'<button class="abtn no" style="margin-top:10px" data-act="tpldel">حذف هذا النوع</button>':'';
}
async function tplSave(){
  const f=S.sheet,isNew=f.type==='__new',cus=isNew||!!(TYPES[f.type]&&TYPES[f.type].custom);
  if(cus){
    const label=(f.label||'').trim();
    if(!label){toast('اكتب اسم نوع العمل');return}
    if(Object.entries(TYPES).some(([k,v])=>k!==f.type&&v.label===label)){toast('فيه نوع عمل بنفس الاسم');return}
    if(!f.steps.length){toast('أضف مرحلة واحدة على الأقل');return}
    const list=customTypes().map(x=>({...x}));
    if(isNew&&list.length>=20){toast('وصلت الحد الأعلى للأنواع المضافة (20)');return}
    const k=isNew?'c_'+Date.now().toString(36):f.type,row={k,label,steps:[...f.steps]},i=list.findIndex(x=>x.k===k);
    if(i>=0)list[i]=row;else list.push(row);
    if(!(await saveCustom(list)))return;
    f.type=k;f.label=label;toast(isNew?'تمت إضافة النوع: '+label:'تم حفظ النوع: '+label);drawTpl();return;
  }
  if(!f.steps.length){toast('أضف مرحلة واحدة على الأقل');return}
  const {error}=await sb.from('templates').upsert({type:f.type,steps:f.steps,updated_at:new Date().toISOString()});
  if(error){toast('تعذر الحفظ');return}
  S.tpl[f.type]=[...f.steps];toast('تم حفظ قالب: '+TYPES[f.type].label);
}

/* ---------- إشعارات الجوال ---------- */
const pushOK=()=>'serviceWorker'in navigator&&'PushManager'in window&&'Notification'in window;
const b64u=s=>{const p='='.repeat((4-s.length%4)%4);const r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
async function pushSub(){try{const reg=await navigator.serviceWorker.getRegistration();return reg?await reg.pushManager.getSubscription():null}catch(e){return null}}
async function openPush(){
  S.sheet={kind:'push'};
  openSheet(`<div class="row" style="margin-bottom:14px"><h2 style="font-size:18px">الإشعارات</h2><button class="x" data-act="close">×</button></div><div id="pBody"><div class="spin"></div></div>`);
  if(!pushOK()){$('#pBody').innerHTML=`<div class="notice">هذا المتصفح ما يدعم الإشعارات.<br><b>على الآيفون:</b> لازم تفتح التطبيق من أيقونته في الشاشة الرئيسية (مو من Safari مباشرة)، ويكون النظام iOS 16.4 أو أحدث. إذا كانت الأيقونة مضافة من قبل وما اشتغلت، احذفها وأضفها من جديد.</div>`;return}
  const sub=await pushSub();const el=$('#pBody');if(!el||S.sheet?.kind!=='push')return;
  const info='<div class="meta" style="margin-top:6px;line-height:1.7">يوصلك إشعار لما أحد يكتب في محادثة عمل أو يذكرك فيها، وعند نشر تعميم جديد، وتذكير بالجلسة قبلها بيوم وفي يومها، والتذكيرات الشهرية. التفعيل خاص بهذا الجهاز.</div>';
  el.innerHTML=sub&&Notification.permission==='granted'
    ?`<div class="card">✅ الإشعارات <b>مفعّلة</b> على هذا الجهاز.${info}</div><button class="primary" style="background:var(--red)" data-act="pushoff">إيقاف الإشعارات</button>`
    :`<div class="card">الإشعارات <b>غير مفعّلة</b> على هذا الجهاز.${info}</div>${Notification.permission==='denied'?'<div class="notice">الإشعارات مرفوضة من إعدادات الجهاز. فعّلها من: الإعدادات ← الإشعارات ← ABN.</div>':''}<button class="primary" data-act="pushon">تفعيل الإشعارات</button>`;
}
async function pushOn(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('ما تم السماح بالإشعارات');openPush();return}
    const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
    const r=await fetch(SUPABASE_URL+'/functions/v1/push');const k=(await r.json()).key;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k)});const j=sub.toJSON();
    const {error}=await sb.rpc('save_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
    if(error)throw error;
    toast('تم تفعيل الإشعارات');
  }catch(e){toast('تعذر تفعيل الإشعارات')}
  openPush();
}
async function pushOff(){
  try{const sub=await pushSub();if(sub){await sb.rpc('drop_push',{p_endpoint:sub.endpoint});await sub.unsubscribe()}toast('تم إيقاف الإشعارات')}catch(e){}
  openPush();
}
if('serviceWorker'in navigator)navigator.serviceWorker.addEventListener('message',e=>{const id=e.data&&e.data.open;if(id){pendOpen=id;openPending()}});

function openPending(){

/* تحديث اشتراك الإشعارات لهذا الجهاز باسم المستخدم الحالي */
function pushSync(){
  try{if(!pushOK()||Notification.permission!=='granted')return;
    pushSub().then(sub=>{if(!sub)return;const j=sub.toJSON();if(j&&j.keys)sb.rpc('save_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth}).then(()=>{},()=>{})}).catch(()=>{})}catch(e){}
}
async function pushDrop(){try{const sub=await pushSub();if(sub){await sb.rpc('drop_push',{p_endpoint:sub.endpoint});await sub.unsubscribe()}}catch(e){}}
/* ---------- الخط الزمني للقضية ---------- */
const ML={received:'الاستلام',offer:'إرسال العرض',accepted:'قبول العميل',paid:'الدفع',expert:'تعيين الخبير',report:'التقرير الأولي',objected:'الاعتراض',returned:'إرجاع الشيخ',final:'التقرير النهائي',done:'الاكتمال'};
const MK=Object.keys(ML);
const RULE={'offer>accepted':d=>addWork(d,5),'accepted>paid':d=>addWork(d,10),'paid>expert':d=>addWork(d,10),'expert>report':d=>addDays(d,30),'objected>final':d=>addWork(d,10),'returned>final':d=>addWork(d,10)};
const TLPAL=['#13406F','#1F5E9E','#4C86C6','#7FA9D8','#5B7A99','#2E6F9E','#0B2545'];
function timeline(w){
  const d={...(w.flow.dates||{}),received:w.received},e=eff(w);
  const ms=MK.filter(k=>d[k]).map(k=>({k,d:d[k]})).sort((a,b)=>a.d.localeCompare(b.d)||MK.indexOf(a.k)-MK.indexOf(b.k));
  const segs=[];
  for(let i=1;i<ms.length;i++){const a=ms[i-1],b=ms[i],r=RULE[a.k+'>'+b.k];segs.push({l:ML[a.k]+' ← '+ML[b.k],n:dayDiff(a.d,b.d),late:r?Math.max(0,dayDiff(r(a.d),b.d)):0})}
  const open=e.stage!=='done'&&e.stage!=='rejected';
  if(ms.length&&open){const a=ms[ms.length-1],t=todayISO();if(t>=a.d)segs.push({l:FL[e.base]+' (جارية)',n:dayDiff(a.d,t),late:e.dl?Math.max(0,dayDiff(e.dl,t)):0,now:true})}
  if(!segs.length)return'';
  const tot=segs.reduce((s,x)=>s+x.n,0);
  const col=(x,i)=>x.late?'var(--red)':x.now?'var(--gold)':TLPAL[i%TLPAL.length];
  return`<div class="card"><div class="row"><b>الخط الزمني</b><span class="meta">المدة الكلية: <b>${tot}</b> يوم</span></div>
  <div class="tl">${segs.map((x,i)=>`<i style="flex:${Math.max(x.n,tot*0.04)||1};background:${col(x,i)}"></i>`).join('')}</div>
  ${segs.map((x,i)=>`<div class="tlr"><i style="background:${col(x,i)}"></i><span>${esc(x.l)}</span>${x.late?`<em>تأخر ${x.late} يوم</em>`:''}<b>${x.n} يوم</b></div>`).join('')}
  <div class="meta" style="margin-top:6px">من ${fmtD(ms[0].d)} إلى ${open?'اليوم':fmtD(ms[ms.length-1].d)}</div></div>`;
}

/* ---------- النسخة الاحتياطية ---------- */
const BKKEY='abn_bk';
const bkLast=()=>{try{return +localStorage.getItem(BKKEY)||0}catch(e){return 0}};
const BKUSER='f4d1312c-3b69-4605-906a-c6cef9e966a0';
const bkDue=()=>S.me?.id===BKUSER&&S.works.length>0&&Date.now()-bkLast()>7*864e5;
function bkNote(){return bkDue()?`<div class="card goldEdge" data-act="backup" style="cursor:pointer"><b>💾 النسخة الاحتياطية الأسبوعية</b><div class="meta" style="margin-top:4px;line-height:1.7">${bkLast()?'مر أكثر من أسبوع على آخر نسخة نزّلتها على هذا الجهاز.':'ما نزّلت نسخة احتياطية على هذا الجهاز بعد.'} اضغط هنا لتنزيل ملف Excel.</div></div>`:''}
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';x.onload=ok;x.onerror=no;document.head.appendChild(x)})}
async function allRows(t,ord){let out=[],i=0;for(;;){const {data,error}=await sb.from(t).select('*').order(ord,{ascending:true}).range(i,i+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;i+=1000}return out}
let BK=null,bkBusy=false;
async function backup(){
  if(bkBusy)return;bkBusy=true;BK=null;
  S.sheet={kind:'bk'};
  openSheet(`<div class="row" style="margin-bottom:14px"><h2 style="font-size:18px">النسخة الاحتياطية</h2><button class="x" data-act="close">×</button></div><div id="bkBody"><div class="notice">جاري تجهيز النسخة…</div></div>`);
  try{
    await loadXLSX();
    const [works,msgs,anns,act,profs,tpls]=await Promise.all([allRows('works','created_at'),allRows('messages','created_at'),allRows('announcements','created_at'),allRows('activity','created_at'),allRows('profiles','created_at'),allRows('templates','type')]);
    const nm=id=>(profs.find(p=>p.id===id)||{}).full_name||'';
    const wk=id=>works.find(w=>w.id===id)||{};
    const dt=v=>{if(!v)return'';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('sv-SE',{timeZone:'Asia/Riyadh'}).slice(0,16)};
    const STT={new:'جديد',prog:'جاري',late:'متأخر',done:'منجز',rej:'مرفوض'};
    const W=works.map(w=>{const fl=isFlow(w),st=Array.isArray(w.steps)?w.steps:[];const r={'الرمز':w.code||'','النوع':(TYPES[w.type]||{}).label||w.type,'العنوان':w.title||'','العميل':w.client||'','المرجع':w.ref||'','الحالة':STT[statusOf(w)]||'','المرحلة':fl?FL[eff(w).stage]||'':st.length?st.filter(x=>x.done).length+' من '+st.length:'','موعد التسليم':w.due||'','الجلسة':w.hearing||''};
      FDATES.forEach(([k,l])=>{r[l]=(w.flow&&w.flow.dates&&w.flow.dates[k])||(k==='received'?w.received||'':'')});
      r['سبب الرفض']=(w.flow&&w.flow.reason)||'';r['تاريخ الإنجاز']=w.completed_at?String(w.completed_at).slice(0,10):'';r['أضافه']=nm(w.created_by);r['تاريخ الإضافة']=dt(w.created_at);r['flow']=w.flow?JSON.stringify(w.flow):'';r['steps']=st.length?JSON.stringify(st):'';r['id']=w.id;return r});
    const ST=[],N=[];
    works.forEach(w=>{(Array.isArray(w.steps)?w.steps:[]).forEach((x,i)=>ST.push({'الرمز':w.code||'','العمل':w.title||'','الترتيب':i+1,'المرحلة':x.t||'','منجزة':x.done?'نعم':'لا','تاريخ الإنجاز':dt(x.at)}));
      (Array.isArray(w.notes)?w.notes:[]).forEach(x=>N.push({'الرمز':w.code||'','العمل':w.title||'','الملاحظة':x.text||'','الكاتب':nm(x.by),'التاريخ':dt(x.at)}))});
    const M=msgs.map(m=>({'الرمز':wk(m.work_id).code||'','العمل':wk(m.work_id).title||'','الكاتب':nm(m.author),'الرسالة':m.body||'','التاريخ':dt(m.created_at)}));

    const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    BK={name:'ABN-backup-'+todayISO()+'.xlsx',blob:new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})};

  }catch(e){const el=$('#bkBody');if(el)el.innerHTML='<div class="notice">تعذر تجهيز النسخة. تأكد من الاتصال بالإنترنت وحاول مرة ثانية.</div>'}
  bkBusy=false;
}
async function bkSave(){
  if(!BK)return;
  const done=()=>{try{localStorage.setItem(BKKEY,String(Date.now()))}catch(e){}toast('تم حفظ النسخة الاحتياطية')};
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform||''));
  if(ios&&navigator.canShare){try{const f=new File([BK.blob],BK.name,{type:BK.blob.type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});done();return}}catch(e){if(e&&e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(BK.blob);a.download=BK.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);done();
}

/* ---------- حاسبة التسعير (تجريبي) ---------- */
const PRICE0={case:0,report:0,fs:0,tax:0,med:1.4,big:2,cx:1.3,urg:1.2,party:10,year:8};
const PLBL={case:'أساس القضية المحاسبية (ريال)',report:'أساس التقرير (ريال)',fs:'أساس مراجعة القوائم لكل سنة (ريال)',tax:'أساس الإقرار الضريبي الواحد (ريال)',med:'معامل حجم المستندات: متوسط',big:'معامل حجم المستندات: كبير',cx:'معامل العمل المعقّد',urg:'معامل الاستعجال',party:'زيادة لكل طرف إضافي بعد اثنين (%)',year:'زيادة لكل سنة مالية إضافية في القضية (%)'};
const priceCfg=()=>({...PRICE0,...(S.tpl.pricing&&!Array.isArray(S.tpl.pricing)?S.tpl.pricing:{})});
const nf=n=>Math.round(n).toLocaleString('en-US');
const PFLD={case:['med','big','cx','urg','party','year'],report:['med','big','cx','urg'],fs:['med','big','cx','urg'],tax:['urg']};
const pfor=(c,t)=>{const o={base:c[t]};PFLD[t].forEach(k=>{const v=c.f&&c.f[t]?c.f[t][k]:undefined;o[k]=typeof v==='number'?v:c[k]});return o};
function calcPrice(f,c){
  const k=pfor(c,f.type),sz=f.size==='b'?k.big:f.size==='m'?k.med:1;let p;
  if(f.type==='case')p=k.base*sz*(1+k.party/100*Math.max(0,f.parties-2))*(1+k.year/100*Math.max(0,f.years-1));
  else if(f.type==='report')p=k.base*sz;
  else if(f.type==='fs')p=k.base*Math.max(1,f.years)*sz;
  else p=k.base*Math.max(1,f.count);
  if(f.cx&&f.type!=='tax')p*=k.cx;
  if(f.urg)p*=k.urg;
  return p;
}
function calcEdit(){
  const f=S.sheet;f.edit=!f.edit;
  if(f.edit){const c=priceCfg();f.draft={};Object.keys(PFLD).forEach(t=>f.draft[t]=pfor(c,t))}
  drawCalc();
}
function openCalc(){
  S.sheet={kind:'calc',type:'case',size:'s',parties:2,years:1,count:1,cx:false,urg:false,edit:false};
  openSheet(`<div class="row" style="margin-bottom:14px"><h2 style="font-size:18px">حاسبة التسعير <span class="pill tag">تجريبي</span></h2><button class="x" data-act="close">×</button></div><div id="cBody"></div>`);
  drawCalc();
}
function drawCalc(){
  const f=S.sheet,c=priceCfg(),el=$('#cBody');if(!el)return;
  if(f.edit){
    const d=f.draft[f.type];
    el.innerHTML=`<div class="notice">كل نوع عمل له أرقامه الخاصة. اختر النوع وعدّل أرقامه، وبعدها اضغط حفظ. تنحفظ للكل.</div><div class="wrap">${Object.keys(PFLD).map(k=>`<button class="chip ${f.type===k?'on':''}" data-ctype="${k}">${TYPES[k].label}</button>`).join('')}</div><div class="card" style="padding:4px 14px">${['base'].concat(PFLD[f.type]).map(k=>`<div class="drow"><label>${k==='base'?PLBL[f.type]:PLBL[k]}</label><input type="number" inputmode="decimal" step="any" min="0" data-cfg="${k}" value="${d[k]}"></div>`).join('')}</div><button class="primary" data-act="calcsave">حفظ</button><button class="abtn alt" data-act="calcedit">رجوع للحاسبة</button>`;
    return;
  }
  const chip=(on,attr,l)=>`<button class="chip ${on?'on':''}" ${attr}>${l}</button>`;
  const num=(k,l,min)=>`<div class="drow"><label>${l}</label><input type="number" inputmode="numeric" min="${min}" step="1" data-cnum="${k}" value="${f[k]}"></div>`;
  let h=`<label class="lbl">نوع العمل</label><div class="wrap">${['case','report','fs','tax'].map(k=>chip(f.type===k,`data-ctype="${k}"`,TYPES[k].label)).join('')}</div>`;
  if(f.type!=='tax')h+=`<label class="lbl">حجم المستندات</label><div class="wrap">${[['s','صغير'],['m','متوسط'],['b','كبير']].map(([k,l])=>chip(f.size===k,`data-csize="${k}"`,l)).join('')}</div>`;
  let nums='';
  if(f.type==='case')nums+=num('parties','عدد الأطراف',2)+num('years','عدد السنوات المالية محل النزاع',1);
  if(f.type==='fs')nums+=num('years','عدد السنوات المالية',1);
  if(f.type==='tax')nums+=num('count','عدد الإقرارات',1);
  if(nums)h+=`<div class="card" style="padding:4px 14px">${nums}</div>`;
  h+=`<div class="wrap">${f.type!=='tax'?chip(f.cx,'data-ctog="cx"','عمل معقّد'):''}${chip(f.urg,'data-ctog="urg"','مستعجل')}</div><div id="cRes"></div>
  <div class="meta" style="line-height:1.7;margin-bottom:12px">تقدير أولي للاستئناس فقط. مبني على أسعار أساس ومعاملات تحددونها أنتم، وليس على تحليل للأعمال السابقة.</div>
  ${isAdmin()?'<button class="abtn alt" data-act="calcedit">تعديل أسعار الأساس والمعاملات</button>':''}`;
  el.innerHTML=h;drawRes();
}
function drawRes(){
  const el=$('#cRes');if(!el)return;const f=S.sheet,c=priceCfg();
  if(!c[f.type]){el.innerHTML='<div class="notice">ما تم تحديد سعر أساس لهذا النوع بعد.</div>';return}
  const p=Math.round(calcPrice(f,c)/50)*50;
  el.innerHTML=`<div class="card goldEdge"><div class="meta">السعر المقترح (قبل الضريبة)</div><div class="big">${nf(p)} <span style="font-size:14px">ريال</span></div><div class="meta" style="margin-top:6px">النطاق المعقول: ${nf(p*0.9)} – ${nf(p*1.15)} ريال</div><div class="meta">شامل ضريبة القيمة المضافة 15%: <b>${nf(p*1.15)}</b> ريال</div></div>`;
}
async function calcSave(){
  const cfg={...priceCfg()},dr=S.sheet.draft;cfg.f={};
  Object.keys(PFLD).forEach(t=>{cfg[t]=dr[t].base;cfg.f[t]={};PFLD[t].forEach(k=>cfg.f[t][k]=dr[t][k])});
  const {error}=await sb.from('templates').upsert({type:'pricing',steps:cfg,updated_at:new Date().toISOString()});
  if(error){toast('تعذر الحفظ');return}
  S.tpl.pricing=cfg;S.sheet.edit=false;toast('تم حفظ الأسعار');drawCalc();
}

function bar(p,st,cls=''){return`<div class="bar ${cls||(st==='done'?'done':st==='late'?'late':'')}"><i style="width:${p}%"></i></div>`}
function wcard(w){
  const p=pctOf(w),s=statusOf(w);let foot;
  if(isFlow(w)){const e=eff(w);foot=`<span><b>${esc(FL[e.stage])}</b></span><span>${esc(dlText(e))}</span>`}
  else{const st=w.steps||[];foot=`<span><b>${p}%</b> · ${st.filter(x=>x.done).length}/${st.length} مراحل</span><span>${w.due?'التسليم '+fmtD(w.due):'بدون موعد'}</span>`}
  return`<div class="wcard" data-open="${esc(w.id)}"><div class="row"><span class="pill type">${esc(typeL(w.type))}</span><span class="pill ${ST[s].c}">${ST[s].l}</span></div><h3>${esc(w.title)}${unreadOf(w.id).length?` <span class="cbadge">💬 ${unreadOf(w.id).length}</span>`:''}</h3><div class="meta">${esc(w.client||'—')}${w.ref?' · '+esc(w.ref):''}</div>${bar(p,s)}<div class="row meta">${foot}</div></div>`;
}

function alerts(){

    if(w.hearing===t)a.push(['🔔 جلسة اليوم',w]);else if(w.hearing===tm)a.push(['🔔 جلسة غدًا',w]);

    else if(w.due&&statusOf(w)!=='done'){const n=dayDiff(t,w.due);if(n<0)a.push(['⏰ تأخر موعد التسليم',w]);else if(n<=2)a.push(['⏰ التسليم: '+rem(w.due),w])}
  });

let armT=null,factT=0;
const PREVK={offer:'received',accept:'offer',pay:'accepted',expert:'paid',report:'expert',objection:'report'};
function arm(btn,label,orig,fn){if(btn.classList.contains('arm')){fn();return}btn.classList.add('arm');btn.textContent=label;clearTimeout(armT);armT=setTimeout(()=>{btn.classList.remove('arm');btn.textContent=orig},3000)}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-open],[data-act],[data-step],[data-rmstep],[data-rmdraft],[data-st],[data-delann],[data-ftype],[data-fact],[data-clr],[data-tplrm],[data-tplup],[data-tpltype],[data-ctype],[data-csize],[data-ctog],[data-men]');if(!t)return;
  const d=t.dataset;
  if(d.men){menAdd(d.men);return}
  if(d.ctype){S.sheet.type=d.ctype;drawCalc();return}
  if(d.csize){S.sheet.size=d.csize;drawCalc();return}
  if(d.ctog){S.sheet[d.ctog]=!S.sheet[d.ctog];drawCalc();return}
  if(d.tpltype){const k=d.tpltype;S.sheet.type=k;if(k==='__new'||!TYPES[k]){S.sheet.type='__new';S.sheet.label='';S.sheet.steps=[]}else{S.sheet.label=TYPES[k].custom?TYPES[k].label:'';S.sheet.steps=[...stepsFor(k)]}drawTpl();return}
  if(d.tplrm!==undefined){S.sheet.steps.splice(+d.tplrm,1);drawTpl();return}
  if(d.tplup!==undefined){const i=+d.tplup,a=S.sheet.steps;[a[i-1],a[i]]=[a[i],a[i-1]];drawTpl();return}
  if(d.clr){const i=t.parentElement.querySelector('input[type=date]');if(i&&i.value){i.value='';i.dispatchEvent(new Event('change',{bubbles:true}))}return}
  if(d.tab){S.tab=d.tab;if(S.tab==='ann')ls('abn_ann_seen',String(Date.now()));window.scrollTo(0,0);renderAll();return}
  if(d.st){S.st=d.st;document.querySelectorAll('.chips .chip').forEach(b=>b.classList.toggle('on',b.dataset.st===S.st));drawList();return}
  if(d.open){openDetail(d.open);return}
  if(d.ftype){S.sheet.type=d.ftype;S.sheet.steps=[...stepsFor(d.ftype)];drawForm();return}
  if(d.rmdraft!==undefined){S.sheet.steps.splice(+d.rmdraft,1);drawForm();return}
  if(d.delann){arm(t,'تأكيد الحذف','حذف',async()=>{const {error}=await sb.from('announcements').delete().eq('id',d.delann);toast(error?'تعذر الحذف':'تم الحذف');load()});return}
  const w=S.sheet?.kind==='detail'?S.works.find(x=>x.id===S.sheet.id):null;
  if(d.fact!==undefined&&w&&isFlow(w)){
    const a=(ACTS[eff(w).base]||[])[+d.fact];if(!a)return;
    if(Date.now()-factT<900)return;factT=Date.now();
    const dt=$('#adate')?.value||todayISO();
    if(a[1]!=='reopen'){const pk=PREVK[w.flow.stage],pv=pk==='received'?w.received:(w.flow.dates||{})[pk];if(pv&&dt<pv){toast('تاريخ الإجراء قبل تاريخ المرحلة السابقة ('+fmtD(pv)+')');return}}const f=JSON.parse(JSON.stringify(w.flow));f.dates=f.dates||{};
    if(a[1]==='reopen'){f.stage=f.prev||'accept';delete f.prev;delete f.reason;delete f.dates.rejected;f.reopened=dt}
    else{
      if(a[1]==='rejected'){f.prev=f.stage;f.reason=a[0]}
      f.dates[a[2]]=dt;
      if(a[1]==='done')f.dates.done=dt;
      if(a[1]==='revise')delete f.dates.done;
      f.stage=a[1];
    }
    if(await updateWork(w.id,{flow:f}))toast(a[1]==='reopen'?'تمت إعادة فتح العرض':'انتقلت إلى: '+FL[f.stage]);
    return;
  }
  if(d.step!==undefined&&w){const steps=(w.steps||[]).map(x=>({...x}));const s=steps[+d.step];if(!s)return;s.done=!s.done;if(s.done){s.at=new Date().toISOString();s.by=myId()}else{delete s.at;delete s.by}local(w.id,withCompletion(w,steps));if(steps.every(x=>x.done))toast('اكتمل العمل 100%');rpc('set_step',{p_work:w.id,p_idx:+d.step,p_done:s.done});return}
  if(d.rmstep!==undefined&&w){arm(t,'حذف؟','×',()=>{const i=+d.rmstep;local(w.id,withCompletion(w,w.steps.filter((_,k)=>k!==i)));rpc('remove_step',{p_work:w.id,p_idx:i})});return}
  switch(d.act){
    case'close':closeSheet();break;
    case'account':openAccount();break;
    case'log':openLog();break;
    case'pass':openPass();break;
    case'sendmsg':sendMsg();break;
    case'backup':backup();break;
    case'bksave':bkSave();break;
    case'push':openPush();break;
    case'calc':openCalc();break;
    case'calcedit':calcEdit();break;
    case'calcsave':calcSave();break;
    case'pushon':pushOn();break;
    case'pushoff':pushOff();break;
    case'tpl':openTpl();break;
    case'tplsave':tplSave();break;
    case'tpldel':{const k=S.sheet.type,n=S.works.filter(x=>x.type===k).length;if(n){toast('ما ينحذف: فيه '+n+' عمل من هذا النوع');break}arm(t,'اضغط مرة ثانية للتأكيد','حذف هذا النوع',async()=>{if(await saveCustom(customTypes().filter(x=>x.k!==k))){toast('تم حذف النوع');S.sheet.type='report';S.sheet.label='';S.sheet.steps=[...stepsFor('report')];drawTpl()}});break}
    case'tpladd':{const i=$('#tplstep');const v=i.value.trim();if(v){S.sheet.steps.push(v);i.value='';drawTpl()}break}
    case'logout':closeSheet();await pushDrop();await sb.auth.signOut();break;
    case'tipoff':ls('abn_tip_off','1');renderView();break;
    case'fstep':{const i=$('#fstep');const v=i.value.trim();if(v){S.sheet.steps.push(v);i.value='';drawForm()}break}
    case'addstep':{const i=$('#nstep');const v=i.value.trim();if(!v||!w)break;i.value='';local(w.id,withCompletion(w,[...(w.steps||[]),{t:v,done:false}]));rpc('add_step',{p_work:w.id,p_text:v});break}
    case'editwork':if(w)openWorkForm(w.id);break;
    case'delwork':if(w)arm(t,'اضغط مرة ثانية للتأكيد','حذف',async()=>{const id=w.id;closeSheet();const {error}=await sb.from('works').delete().eq('id',id);toast(error?'تعذر الحذف':'تم حذف العمل');load()});break;
  }
});
document.addEventListener('change',e=>{
  const k=e.target.dataset?.fdate;if(!k)return;
  const w=S.sheet?.kind==='detail'?S.works.find(x=>x.id===S.sheet.id):null;if(!w||!isFlow(w))return;
  const v=e.target.value||null;
  if(k==='received'){updateWork(w.id,{received:v});return}
  const f=JSON.parse(JSON.stringify(w.flow));f.dates=f.dates||{};if(v)f.dates[k]=v;else delete f.dates[k];
  updateWork(w.id,{flow:f});
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;drawList()}if(e.target.id==='tlabel'&&S.sheet?.kind==='tpl')S.sheet.label=e.target.value;const g=e.target.dataset?.cfg;if(g&&S.sheet?.draft){const v=parseFloat(e.target.value);if(!isNaN(v)&&v>=0)S.sheet.draft[S.sheet.type][g]=v}const k=e.target.dataset?.cnum;if(k&&S.sheet?.kind==='calc'){const v=parseInt(e.target.value,10);S.sheet[k]=isNaN(v)?1:Math.max(1,Math.min(99,v));drawRes()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='nstep'||e.target.id==='fstep')){e.preventDefault();document.querySelector(e.target.id==='nstep'?'[data-act=addstep]':'[data-act=fstep]').click()}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
$('#fab').addEventListener('click',()=>{S.tab==='ann'?openAnnForm():openWorkForm()});
</script>
</body>
</html>
